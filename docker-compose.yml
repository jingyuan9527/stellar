# =============================================================================
# Stellar 部署编排：单镜像双进程（Nginx + Spring Boot），由 supervisord 托管。
# PostgreSQL 与 Redis 均使用外部实例，连接信息由 .env 注入容器。
# 文件上传存数据库 sys_file 表，无磁盘卷依赖。
# -----------------------------------------------------------------------------
# 用法（推荐 CI 打包，服务器零构建负担）：
#   1. cp .env.example .env   并填写数据库连接
#   2. 初始化数据库表结构（首次部署）：
#        psql -h <host> -U <user> -d <db> -f backend/src/main/resources/schema.sql
#   3. docker compose pull && docker compose up -d
#        （ghcr.io 镜像需先在 GitHub Packages 设为 Public，或服务器 docker login ghcr.io）
#   回滚到指定版本：把 image 的 :latest 改为 :<sha>（CI 每次构建打 sha tag）再 up -d
# 本地构建兜底（低内存服务器见 Dockerfile 头部注释）：
#       docker compose up -d --build
# 访问：http://localhost:${FRONTEND_PORT:-80}
# =============================================================================

services:
  stellar:
    image: ghcr.io/jingyuan9527/stellar:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stellar
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-80}:80"
