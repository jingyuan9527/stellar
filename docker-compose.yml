# =============================================================================
# Stellar 部署编排：单镜像双进程（Nginx + Spring Boot），由 supervisord 托管。
# PostgreSQL 使用外部实例，连接信息由 .env 注入容器。
# 文件上传存数据库 sys_file 表，无磁盘卷依赖。
# -----------------------------------------------------------------------------
# 用法：
#   1. cp .env.example .env   并填写数据库连接
#   2. 初始化数据库表结构（首次部署）：
#        psql -h <host> -U <user> -d <db> -f backend/src/main/resources/schema.sql
#   3. docker compose up -d --build
# 访问：http://localhost:${FRONTEND_PORT:-80}
# =============================================================================

services:
  stellar:
    build:
      context: .
      dockerfile: Dockerfile
    image: stellar:latest
    container_name: stellar
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-80}:80"
