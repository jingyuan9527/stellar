# =============================================================================
# Stellar 部署编排：前端(Nginx) + 后端(Spring Boot)
# PostgreSQL 使用外部实例，连接信息由 .env 注入后端容器。
# -----------------------------------------------------------------------------
# 用法：
#   1. cp .env.example .env   并填写数据库连接
#   2. 初始化数据库表结构（首次部署）：
#        psql -h <host> -U <user> -d <db> -f backend/src/main/resources/schema.sql
#   3. docker compose up -d --build
# 访问：http://localhost:${FRONTEND_PORT:-80}
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: stellar-backend:latest
    container_name: stellar-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 上传目录固定指向卷挂载路径，覆盖 .env 中可能存在的同名变量
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    networks:
      - stellar
    # 后端默认仅容器内网可达（经 frontend Nginx 代理）；
    # 如需直连后端调试，取消注释下方 ports：
    # ports:
    #   - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: stellar-frontend:latest
    container_name: stellar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - stellar

networks:
  stellar:
    driver: bridge

volumes:
  uploads:
