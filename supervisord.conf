# Stellar 单容器双进程管理：Nginx(前端SPA+反代) + Spring Boot(后端)
# 任一进程崩溃 supervisord 自动重启；日志直接转发到容器 stdout/stderr 便于 docker logs 查看。

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:stellar-backend]
command=java -jar /app/app.jar
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
