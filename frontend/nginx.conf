# Stellar Nginx 主配置（直接覆盖 /etc/nginx/nginx.conf，不依赖 http.d include）
# - 托管 Vite 构建的 SPA 静态产物
# - /api 反代后端（去掉 /api 前缀，与 vite dev 代理 rewrite 保持一致）
# - /file 反代后端文件接口（保留前缀，由 FileController 解析，二进制存数据库）
# 单镜像双进程部署：后端与本容器内 Nginx 同机，反代走 127.0.0.1:8080
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # SPA history 路由兜底
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存
        location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # 业务接口反代后端（去掉 /api 前缀）
        location /api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            # SSE 流式响应 / 大文件上传需要：禁用缓冲、放宽超时
            proxy_buffering    off;
            proxy_cache         off;
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            client_max_body_size 12m;
        }

        # 文件读取反代后端（保留 /file 前缀，命中 GET /file/{id}）
        location /file/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Memos webhook 回调：Memos 服务器直接 POST（无 /api 前缀），
        # 须绕过 SPA 兜底转发到后端，否则 try_files 命中 index.html 返回 405
        location = /memos/webhook {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_buffering    off;
            proxy_read_timeout  60s;
        }

        # 隐藏版本号
        server_tokens off;
    }
}
