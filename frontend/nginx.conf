# Stellar 前端 Nginx 配置
# - 托管 Vite 构建的 SPA 静态产物
# - /api 反代后端（去掉 /api 前缀，与 vite dev 代理 rewrite 保持一致）
# - /uploads 反代后端静态资源（保留前缀，由后端 ResourceHandler 解析）
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA history 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 业务接口反代后端（去掉 /api 前缀）
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # SSE 流式响应 / 大文件上传需要：禁用缓冲、放宽超时
        proxy_buffering    off;
        proxy_cache         off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        client_max_body_size 12m;
    }

    # 上传静态资源反代后端（保留 /uploads 前缀）
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 隐藏版本号
    server_tokens off;
}
