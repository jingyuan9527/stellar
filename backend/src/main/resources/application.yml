server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: stellar-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/soybean}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      url: ${REDIS_URL:}
      # 显式 db：url 末尾 /db 在某些 Spring Boot 版本不被 Lettuce 解析（会落到 db0），必须显式指定
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  cache:
    type: redis
    redis:
      time-to-live: 30m
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-share: false
  token-style: uuid
  is-log: false
  token-prefix: Bearer

rate-limit:
  default-daily: ${RATE_LIMIT_DAILY:50}

# RAG 检索管线配置（登录用户聊天）：改写/重排/判定各一次 LLM 调用，无需可关
stellar:
  rag:
    top-k: 4
    pool-size: 12
    score-threshold: 0.0
    rewrite-enabled: true
    rerank-enabled: true
    memos-enabled: true
    loop-enabled: true
    loop-max-rounds: 3
    router-enabled: true
    router-simple-length: 12

logging:
  level:
    com.stellar: debug
