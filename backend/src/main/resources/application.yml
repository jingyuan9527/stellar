server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: stellar-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/soybean}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-share: false
  token-style: uuid
  is-log: false
  token-prefix: Bearer

rate-limit:
  default-daily: ${RATE_LIMIT_DAILY:50}

logging:
  level:
    com.stellar: debug
