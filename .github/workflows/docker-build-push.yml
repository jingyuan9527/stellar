name: docker-build-push

# Stellar 镜像 CI 打包：push master / 手动触发时构建镜像推 ghcr.io，服务器零构建负担。
# 首次推送后包默认为 private，需到 GitHub → Packages → stellar → Settings → Change visibility 设为 Public，
# 服务器才可免登录 pull；或服务器用 read:packages PAT `docker login ghcr.io`。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
